<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  CJK fallback for Greak: Memories of Azur (NextOS port).

  The game's dynamic font is Liberation Sans, which has no CJK coverage, and
  the bundled TextMeshPro assets have no CJK fallback font.  Deploy this file
  together with the CJK font files into <gamedir>/fonts/:

      fonts/fonts.conf
      fonts/NotoSansCJKsc-Regular.otf   (owner-supplied)

  The loader sets FONTCONFIG_FILE to this file when it exists and the user
  has not set their own.  Relative <dir>/<cachedir> resolve against the
  directory holding this file, so the layout can be relocated freely.
-->
<fontconfig>
  <dir>.</dir>
  <cachedir>.cache</cachedir>

  <!-- Missing CJK glyphs requested under Latin families fall through to Noto. -->
  <alias binding="same">
    <family>Liberation Sans</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK JP</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK JP</family>
    </prefer>
  </alias>
</fontconfig>
